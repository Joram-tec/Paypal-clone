# Deploys the wallet demo to GitHub Pages every time you push to the main branch.
#
# One-time setup in your repository:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you start a deploy by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install packages
        run: bun install --frozen-lockfile

      - name: Build the static site
        run: npm run build:pages
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Check PWA metadata and icons
        run: npm run test -- src/test/pwa.test.ts

      - name: Check the build actually produced a site
        run: |
          test -s dist/index.html || { echo "dist/index.html is missing"; exit 1; }
          grep -q "assets/" dist/index.html || { echo "no compiled assets referenced"; exit 1; }
          test -s dist/manifest.json || { echo "PWA manifest is missing"; exit 1; }
          test -s dist/sw.js || { echo "PWA service worker is missing"; exit 1; }
          test -s dist/registerSW.js || { echo "PWA registration script is missing"; exit 1; }
          grep -q "registerSW.js" dist/index.html || { echo "service worker is not registered"; exit 1; }

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
